<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f2233">
<title>Large Scale</title>
<style>
:root{--ink:#0f2233;--deep:#10233a;--line:#24506f;--parch:#e9dcb8;--mute:#9fb3c2;--signal:#e8c84a;--bad:#e06a5a;--good:#6fcf7a;--panel:rgba(15,34,51,.92)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep);color:var(--parch);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit;background:#16324a;border:2px solid var(--line);border-radius:3px;padding:6px 10px;min-height:36px}
button{cursor:pointer;background:#183a54}
button:hover:not(:disabled){border-color:var(--mute)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:#2a5a36;border-color:#3f7f4c}
button.ghost{background:transparent;border-color:transparent}
button.danger{background:#5a2420;border-color:var(--bad)}
input[type=range]{padding:0;min-height:0;accent-color:var(--signal)}
input[type=checkbox]{min-height:0;width:18px;height:18px;vertical-align:middle}
h1{font-size:22px;margin:0 0 12px}
h2{font-size:16px;margin:18px 0 8px}
.muted{color:var(--mute)}
.msg{color:var(--signal);min-height:1.4em;margin:8px 0 0}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.row.spread{justify-content:space-between}
#screen{height:100%;overflow:auto;display:flex;flex-direction:column;padding:16px}
#screen>*{margin:auto;flex-shrink:0}
.card{background:var(--ink);border:2px solid var(--line);border-radius:4px;padding:20px;width:min(360px,100%)}
.card.wide{width:min(560px,100%)}
.card form,.form{display:flex;flex-direction:column;gap:10px}
.worlds{display:flex;flex-direction:column;gap:6px}
.world{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px solid var(--line);border-radius:3px;padding:6px 8px}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#game input,#game .lines{user-select:text;-webkit-user-select:text}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
#overlay{position:absolute;inset:0;pointer-events:none}
#overlay>*{pointer-events:auto;touch-action:pan-x pan-y}
.hud{position:absolute;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;padding:6px 10px;padding-top:max(6px,env(safe-area-inset-top));background:var(--panel);border-bottom:2px solid var(--line);flex-wrap:wrap}
.hud .grow{flex:1}
.hud .zoom button{min-width:40px}
.stackform{display:flex;gap:6px;align-items:center}
.status{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
.dot.online{background:var(--good)}
.dot.waiting,.dot.replaced,.dot.outdated,.dot.closed,.dot.removed,.dot.deleted{background:var(--bad)}
.dot.connecting,.dot.reconnecting{background:var(--signal)}
.panel{position:absolute;background:var(--panel);border:2px solid var(--line);border-radius:4px;padding:4px 8px 8px}
.panel .title{padding:4px 0;font-weight:600;min-height:0}
.panel.shut>*:not(.title){display:none!important}
.panel.left{left:8px;top:calc(var(--hud,48px) + 16px);max-height:calc(100% - var(--hud,48px) - 92px);overflow:auto;min-width:220px}
.panel.right{right:8px;bottom:8px;width:min(340px,40vw)}
.panel.topright{right:8px;top:calc(var(--hud,48px) + 16px);width:min(320px,44vw);max-height:calc(100% - 300px);min-height:160px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.tabs button{min-height:30px;padding:2px 8px}
.build-list{display:flex;flex-direction:column;gap:4px}
.build-item{display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:2px}
.build-item .why{color:var(--bad);font-size:12px}
.desc{font-size:12px;line-height:1.35}
.upgrade-name .desc{display:block;color:var(--mute)}
#purse{color:var(--signal)}
.town-lines{display:flex;flex-direction:column;gap:2px}
.next-step{margin:0;padding:6px 8px;border-left:3px solid var(--signal);background:rgba(232,200,74,.08)}
.why{color:var(--bad);font-size:12px;margin:4px 0}
.demand{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;font-size:13px}
.demand .bar{position:relative;height:10px;background:#16324a;border:1px solid var(--line);border-radius:2px}
.demand .bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--mute)}
.demand .fill{position:absolute;top:0;bottom:0}
.demand .fill.up{background:var(--good)}
.demand .fill.down{background:var(--bad)}
.panel.center{left:50%;transform:translateX(-50%);top:calc(var(--hud,48px) + 16px);width:min(980px,calc(100% - 16px));max-height:calc(100% - var(--hud,48px) - 32px);overflow:auto;display:flex;flex-direction:column;gap:8px;z-index:2}
.army-list{display:flex;flex-direction:column;gap:6px}
.army-row{display:flex;flex-direction:column;gap:3px;border:2px solid var(--line);border-radius:3px;padding:6px 8px}
.army-row.locked{opacity:.65}
.upgrade-list{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - var(--hud,48px) - 260px);min-height:120px;overflow:auto}
.upgrade-row{display:grid;grid-template-columns:28px 34px 1fr auto;gap:8px;align-items:center;border:2px solid var(--line);border-radius:3px;padding:4px 6px;cursor:pointer;user-select:none}
.upgrade-row.on{border-color:var(--signal);background:#3a3a1c}
.upgrade-row.locked{opacity:.6;cursor:default}
.upgrade-row .tick{touch-action:none;width:24px;height:24px;border:2px solid var(--mute);border-radius:3px;display:grid;place-items:center;cursor:ns-resize}
.upgrade-row.on .tick::after{content:"";width:12px;height:12px;background:var(--signal)}
.upgrade-row .thumb{width:32px;height:32px;image-rendering:pixelated}
#upgrade-summary{margin:0;color:var(--signal)}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.admin-grid section{display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--line);padding-top:6px}
.admin-list{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.admin-log{font-size:12px;max-height:200px;overflow:auto}
.admin-log p{margin:1px 0}
.admin-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
input.small{width:110px}
.tech-era{display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--line);padding-top:6px}
.tech-grid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:6px}
.tech-col{display:flex;flex-direction:column;gap:4px}
button.tech{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;font-size:13px;padding:4px 8px}
button.tech span{font-size:12px;color:var(--mute)}
button.tech.known{background:#24452c;border-color:#3f7f4c}
button.tech.current{border-color:var(--signal);background:#3a3a1c}
button.tech.queued{border-color:#8fa8c0;border-style:dashed}
button.tech.ready{border-color:var(--good)}
button.tech.locked{opacity:.6}
button.tech.picked{outline:2px solid var(--parch)}
button.tech.era{align-items:center;text-align:center}
.tech-detail{border-top:2px solid var(--line);padding:6px 0 2px;position:sticky;bottom:-8px;background:#0f2233}
.tech-detail p{margin:2px 0}
button.chip{min-height:28px;padding:2px 8px;font-size:12px}
.panel.bottom{left:50%;transform:translateX(-50%);bottom:8px;width:min(560px,calc(100% - 16px));display:flex;flex-direction:column;gap:6px}
#chat .lines{height:160px;overflow:auto;font-size:13px}
#chat .lines p{margin:2px 0}
#chat form{display:flex;gap:6px}
#chat input{flex:1;min-width:0}
.badge{background:var(--signal);color:var(--ink);border-radius:8px;padding:0 6px;font-size:12px;margin-left:4px}
table{border-collapse:collapse;font-size:13px}
td,th{padding:2px 6px;text-align:left}
td:nth-child(n+3),th:nth-child(n+3){text-align:right}
tr.me td{color:var(--signal)}
tr.dead td{opacity:.45;text-decoration:line-through}
.swatch{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:middle}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.on{background:#4cd964;box-shadow:0 0 6px rgba(76,217,100,.8)}
.dot.off{background:#56616d}
.banner{position:absolute;top:calc(var(--hud,48px) + 16px);left:50%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--signal);border-radius:4px;padding:8px 14px;max-width:calc(100% - 16px);text-align:center}
.banner.big{top:40%;font-size:17px;display:flex;flex-direction:column;gap:10px;align-items:center}
#toasts{position:absolute;left:8px;bottom:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
#overlay>.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:2px 8px;font-size:13px;white-space:nowrap;z-index:3;display:flex;gap:6px;align-items:center}
.toast{margin:0;background:var(--panel);border-left:4px solid var(--signal);padding:6px 10px;border-radius:3px;max-width:320px}
kbd.key{font:11px/1 ui-monospace,monospace;border:1px solid var(--mute);border-radius:3px;padding:1px 4px;margin-left:2px;color:var(--mute);vertical-align:middle}
button.on{border-color:var(--signal)}
@media (pointer:coarse){kbd.key,.fine-only{display:none!important}}
[hidden]{display:none!important}
#rotate{display:none}
@media (max-height:500px){
  body{font-size:13px}
  button,input,select{padding:4px 8px;min-height:32px}
  .hud{gap:6px;padding:4px 6px}
  .world-name{display:none}
  .panel.left{top:calc(var(--hud,40px) + 8px);max-height:calc(100% - var(--hud,40px) - 60px);min-width:0}
  .banner{top:calc(var(--hud,40px) + 8px)}
  #chat .lines{height:90px}
  .panel.right{width:min(300px,38vw);bottom:auto;top:calc(var(--hud,40px) + 8px)}
  .panel.bottom{width:min(460px,60vw)}
  #toasts{bottom:auto;top:96px}
}
@media (orientation:portrait) and (max-width:900px){
  #game:not([hidden]) ~ #rotate{display:grid;position:fixed;inset:0;place-items:center;background:var(--ink);font-size:18px;padding:24px;text-align:center;z-index:10}
}
</style>
</head>
<body>
<main id="screen"></main>
<div id="game" hidden><canvas id="map"></canvas><div id="overlay"></div></div>
<div id="rotate">Turn your phone sideways to play.</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
