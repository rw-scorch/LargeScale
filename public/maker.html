<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f2233">
<title>Map Maker</title>
<style>
:root{--ink:#0f2233;--deep:#10233a;--line:#24506f;--parch:#e9dcb8;--mute:#9fb3c2;--signal:#e8c84a;--bad:#e06a5a;--good:#6fcf7a;--panel:rgba(13,29,44,.92);--btn:#183a54;--field:#16324a;--primary:#2a5a36;--primary-edge:#3f7f4c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep);color:var(--parch);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit;background:var(--field);border:2px solid var(--line);border-radius:3px;padding:5px 9px;min-height:34px}
button{cursor:pointer;background:var(--btn)}
button:hover:not(:disabled){border-color:var(--mute)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--primary);border-color:var(--primary-edge)}
button.on{border-color:var(--signal);color:var(--signal)}
button.danger{background:#5a2420;border-color:var(--bad)}
input[type=range]{padding:0;min-height:0;accent-color:var(--signal)}
input[type=number]{width:84px}
.muted{color:var(--mute)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:auto 1fr auto;height:100%}
#bar{grid-column:1/3;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 8px;background:var(--ink);border-bottom:2px solid var(--line)}
#bar .grow{flex:1}
#map-name{width:180px}
#side{overflow-y:auto;padding:8px;background:var(--panel);border-right:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
#side h3{margin:4px 0 0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--signal)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:4px}
.swatch{display:flex;align-items:center;gap:6px;min-height:28px;padding:2px 6px;font-size:12px;text-align:left}
.swatch i{width:16px;height:16px;flex:none;border:1px solid rgba(0,0,0,.5);border-radius:2px}
#view{position:relative;overflow:hidden;background:#07121d}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#status{grid-column:1/3;display:flex;gap:14px;flex-wrap:wrap;padding:4px 10px;background:var(--ink);border-top:2px solid var(--line);font-size:12px;color:var(--mute)}
#status b{color:var(--parch);font-weight:600}
#msg{color:var(--signal)}
dialog{background:var(--ink);color:var(--parch);border:2px solid var(--line);border-radius:4px;max-width:min(520px,calc(100vw - 32px));padding:16px}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{margin:0 0 10px;font-size:16px}
dialog form{display:flex;flex-direction:column;gap:10px}
dialog fieldset{border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;gap:6px}
.maps{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto}
.map{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px solid var(--line);border-radius:3px;padding:6px 8px}
@media (max-width:700px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr 38vh auto}
  #bar{grid-column:1}
  #view{grid-row:2}
  #side{grid-row:3;border-right:0;border-top:2px solid var(--line)}
  #status{grid-column:1}
}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button id="back" class="ghost" title="Back to the game">Back</button>
    <input id="map-name" maxlength="40" placeholder="map name" value="New map">
    <button id="new">New</button>
    <button id="open">Open file</button>
    <button id="save">Save file</button>
    <button id="publish" class="primary">Publish</button>
    <button id="library">Saved maps</button>
    <span class="grow"></span>
    <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="redo" title="Redo (Ctrl+Y)">Redo</button>
    <button id="fit" title="Fit the map (0)">Fit</button>
  </div>
  <div id="side">
    <div class="row" id="tools">
      <button data-tool="brush" title="Brush (B)">Brush</button>
      <button data-tool="fill" title="Fill (F)">Fill</button>
      <button data-tool="pick" title="Pick a terrain from the map (I)">Pick</button>
      <button data-tool="pan" title="Move the view (H, or hold space, or drag with the right button)">Move</button>
    </div>
    <label class="row">Size <input id="size" type="range" min="1" max="60" value="6"> <span id="size-text"></span></label>
    <label class="row">Paint over <select id="only"><option value="any">anything</option><option value="land">land only</option><option value="water">water only</option></select></label>
    <div id="palette"></div>
  </div>
  <div id="view"><canvas id="canvas"></canvas></div>
  <div id="status">
    <span id="s-size"></span><span id="s-land"></span><span id="s-at"></span><span id="msg"></span>
  </div>
</div>

<dialog id="new-dialog">
  <h2>New map</h2>
  <form method="dialog" id="new-form">
    <fieldset>
      <label class="row"><input type="radio" name="start" value="ocean" checked> Empty ocean</label>
      <label class="row"><input type="radio" name="start" value="random"> Random islands, seed <input id="new-seed" type="number" value="7" min="1" max="999999"></label>
      <label class="row">Width <input id="new-w" type="number" value="600"> Height <input id="new-h" type="number" value="400"></label>
    </fieldset>
    <fieldset>
      <label class="row"><input type="radio" name="start" value="earth"> A part of the Earth</label>
      <label class="row">West <input id="new-west" type="number" value="-11" step="0.5"> East <input id="new-east" type="number" value="30" step="0.5"></label>
      <label class="row">North <input id="new-north" type="number" value="60" step="0.5"> South <input id="new-south" type="number" value="35" step="0.5"></label>
      <label class="row"><input id="new-fine" type="checkbox" checked> Fine detail (0.05 degrees a plot)</label>
    </fieldset>
    <p id="new-note" class="muted"></p>
    <div class="row"><button value="ok" class="primary">Make it</button><button value="cancel" formnovalidate>Cancel</button></div>
  </form>
</dialog>

<dialog id="lib-dialog">
  <h2>Saved maps</h2>
  <div class="maps" id="lib-list"></div>
  <form method="dialog"><div class="row"><button value="close">Close</button></div></form>
</dialog>

<input id="file" type="file" accept=".lsmap" hidden>
<script type="module" src="/js/maker/maker.js"></script>
</body>
</html>
