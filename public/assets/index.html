<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Large Scale sprite pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#16324a;--ink:#0f2233;--ink2:#183a54;--line:#24506f;
  --parch:#e9dcb8;--mute:#9fb3c2;--coast:#5d9bd0;--signal:#e8c84a;
  --display:"Pixelify Sans",ui-monospace,"Courier New",monospace;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--sea);color:var(--parch);font:15px/1.5 var(--body)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:12px 18px;background:var(--ink);border-bottom:2px solid var(--line)}
h1{font:600 22px/1 var(--display);margin:0;letter-spacing:.5px}
h1 small{display:block;font:400 13px/1.4 var(--body);color:var(--mute);margin-top:4px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-left:auto}
.search{background:var(--sea);border:2px solid var(--line);padding:6px 10px;width:220px;border-radius:2px}
.search::placeholder{color:var(--mute)}
.ctl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.seg{display:flex;border:2px solid var(--line);border-radius:2px}
.seg button{background:none;border:0;padding:5px 9px;cursor:pointer;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--ink2);color:var(--parch)}
.swatch{width:22px;height:22px;border:2px solid var(--ink);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.swatch[aria-pressed=true]{box-shadow:0 0 0 2px var(--signal)}
.swatch.key{background:repeating-linear-gradient(45deg,#ff00ff 0 4px,#800080 4px 8px)}
input[type=color]{width:26px;height:26px;border:0;padding:0;background:none;cursor:pointer}
.check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);cursor:pointer}
nav{background:var(--ink);border-right:2px solid var(--line);overflow:auto;padding:10px 0}
nav button{display:flex;justify-content:space-between;width:100%;background:none;border:0;padding:6px 18px;text-align:left;cursor:pointer;color:var(--mute)}
nav button span:first-child{font-family:var(--display);font-size:15px}
nav button[aria-current=true]{background:var(--ink2);color:var(--parch);box-shadow:inset 3px 0 0 var(--signal)}
nav hr{border:0;border-top:2px solid var(--line);margin:10px 18px}
main{overflow:auto;position:relative;image-rendering:pixelated}
body.drawer main .stage{padding-right:362px}
.stage{min-height:100%;padding:18px 22px 60px}
section.grp{margin-bottom:26px}
section.grp h2{font:400 16px/1 var(--display);margin:0 0 10px;display:inline-block;background:var(--ink);padding:6px 10px;border-radius:2px}
section.grp h2 span{color:var(--mute);font:13px var(--body);margin-left:8px}
.tiles{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 16px}
.tile{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;padding:4px;cursor:pointer;border-radius:2px}
.tile canvas{display:block;image-rendering:pixelated}
.tile .nm{font-size:12px;line-height:1.2;background:rgba(15,34,51,.86);padding:2px 6px;border-radius:2px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .nm em{font-style:normal;color:var(--signal);margin-left:5px}
.tile:hover .nm,.tile[aria-pressed=true] .nm{background:var(--ink);box-shadow:0 0 0 2px var(--signal)}
.empty{background:var(--ink);padding:18px 20px;max-width:520px;border-radius:2px}
aside{position:fixed;right:0;top:var(--hh,0px);bottom:0;width:340px;max-width:100%;background:var(--ink);border-left:2px solid var(--line);padding:18px;overflow:auto;transform:translateX(100%);transition:transform .18s ease;z-index:5}
aside.open{transform:none}
aside h3{font:600 18px/1.2 var(--display);margin:0 36px 12px 0;word-break:break-word}
.x{position:absolute;right:14px;top:14px;background:none;border:2px solid var(--line);width:30px;height:30px;cursor:pointer;border-radius:2px}
.big{display:flex;align-items:center;justify-content:center;min-height:200px;border:2px solid var(--line);margin-bottom:12px;image-rendering:pixelated}
.big canvas{image-rendering:pixelated}
.variants{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.variants button{background:var(--sea);border:2px solid var(--line);padding:3px;cursor:pointer;border-radius:2px}
.variants button[aria-pressed=true]{border-color:var(--signal)}
.variants canvas{display:block;image-rendering:pixelated}
.row{display:flex;gap:8px;margin-bottom:12px}
.btn{background:var(--ink2);color:var(--parch);border:2px solid var(--line);padding:5px 12px;cursor:pointer;border-radius:2px;text-decoration:none;font-size:14px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
dt{color:var(--mute)}
dd{margin:0;word-break:break-word}
.terrain{max-width:1100px;background:var(--ink);padding:16px 18px;border-radius:2px}
.terrain .mapwrap{overflow-x:auto;border:2px solid var(--line);display:inline-block;max-width:100%;margin:10px 0 18px}
.terrain canvas{display:block;image-rendering:pixelated}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 18px}
.pal div{display:flex;align-items:center;gap:8px;font-size:13px}
.pal span.n{flex:1;color:var(--mute)}
.pal button{width:18px;height:18px;border:0;padding:0;cursor:pointer}
.status{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);border:2px solid var(--signal);padding:6px 12px;border-radius:2px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .15s}
.status.on{opacity:1}
p.lede{max-width:64ch;color:var(--mute);margin:0 0 6px}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
  nav{display:flex;overflow-x:auto;padding:0;border-right:0;border-bottom:2px solid var(--line)}
  nav button{width:auto;white-space:nowrap;gap:8px;padding:8px 12px}
  nav hr{display:none}
  .controls{margin-left:0}
  .search{width:100%}
  aside{top:auto;height:62%;width:100%;border-left:0;border-top:2px solid var(--line);transform:translateY(100%)}
  body.drawer main .stage{padding-right:22px;padding-bottom:65vh}
}
@media (prefers-reduced-motion:reduce){aside,.status{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Large Scale sprite pack<small id="sub"></small></h1>
    <div class="controls">
      <input class="search" id="q" type="search" placeholder="Search sprites, e.g. tank or road" aria-label="Search sprites">
      <div class="ctl">Zoom <div class="seg" id="zoom" role="group" aria-label="Zoom"></div></div>
      <div class="ctl">Team <span id="teams" style="display:flex;gap:6px;align-items:center"></span></div>
      <div class="ctl">Ground <div class="seg" id="ground" role="group" aria-label="Background"></div></div>
      <label class="check"><input type="checkbox" id="lots" checked> Lots under buildings</label>
      <label class="check"><input type="checkbox" id="night"> Night</label>
      <label class="check"><input type="checkbox" id="all"> Every state and frame</label>
    </div>
  </header>
  <nav id="nav" aria-label="Categories"></nav>
  <main id="main"><div class="stage" id="stage"></div></main>
</div>
<aside id="drawer" aria-label="Sprite details">
  <button class="x" id="close" aria-label="Close details">&#x2715;</button>
  <h3 id="dTitle"></h3>
  <div class="big" id="dBig"></div>
  <div class="variants" id="dVar"></div>
  <div class="row"><button class="btn" id="dPlay" hidden>Play frames</button><a class="btn" id="dFile" download>Download PNG</a></div>
  <dl id="dMeta"></dl>
</aside>
<div class="status" id="status" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script>
const P = window.PACK;
const KEYS = [[255,0,255],[192,0,192],[128,0,128]];
const CAT_ORDER = ["housing","commercial","industry","agriculture","energy","civic","transport","tourism","military","lots","features","units","people","markers","vehicles","aircraft","ships","effects","overlays","resources","terrain","ui","mapicons"];
const LABEL = {ui:"Interface",mapicons:"Map icons",resources:"Deposits",terrain:"Terrain decor",lots:"Lots",features:"Terrain features"};
const ERA_ORDER = ["Tribal","Medieval","Gunpowder","Industrial","Modern","Future"];
const TEAMS = ["#4f8fe0","#d94a3a","#4fae4a","#e0b53a","#9a5fd0"];
const GROUNDS = [["grass","grassland","summer"],["water","ocean","summer"],["sand","desert","summer"],["snow","snow","winter"],["dark",null],["clear",null]];
const S = {cat:"housing", q:"", zoom:3, team:TEAMS[0], ground:"grass", all:false, lots:true, night:false, sel:null, variant:0, timer:null};
const NO_DARK = new Set(["effects","ui","overlays","mapicons","markers"]);
const NIGHT = "rgba(12,18,52,.62)";
const byId = new Map(P.sprites.map(s => [s.id, s]));
const $ = id => document.getElementById(id);

const sheets = {}, tinted = {};
function loadSheets(){
  return Promise.all(Object.entries(P.sheets).map(([k,src]) => new Promise(res => {
    const im = new Image();
    im.onload = () => { const c = document.createElement("canvas"); c.width = im.width; c.height = im.height; c.getContext("2d").drawImage(im,0,0); sheets[k] = c; res(); };
    im.src = src;
  })));
}
function shadeHex(hex, f){
  const n = parseInt(hex.slice(1),16); return [(n>>16&255)*f|0,(n>>8&255)*f|0,(n&255)*f|0];
}
function sheetFor(cat){
  if (S.team === "key") return sheets[cat];
  const key = cat + S.team;
  if (tinted[key]) return tinted[key];
  const src = sheets[cat], c = document.createElement("canvas");
  c.width = src.width; c.height = src.height;
  const ctx = c.getContext("2d"); ctx.drawImage(src,0,0);
  const d = ctx.getImageData(0,0,c.width,c.height), a = d.data;
  const to = [shadeHex(S.team,1), shadeHex(S.team,.7), shadeHex(S.team,.45)];
  for (let i = 0; i < a.length; i += 4){
    if (!a[i+3]) continue;
    for (let k = 0; k < 3; k++){
      if (a[i]===KEYS[k][0] && a[i+1]===KEYS[k][1] && a[i+2]===KEYS[k][2]){ a[i]=to[k][0]; a[i+1]=to[k][1]; a[i+2]=to[k][2]; break; }
    }
  }
  ctx.putImageData(d,0,0);
  return tinted[key] = c;
}
function blitSprite(ctx, sp, dx, dy, scale){
  ctx.drawImage(sheetFor(sp.category), sp.x, sp.y, sp.w, sp.h, dx*scale, dy*scale, sp.w*scale, sp.h*scale);
}
function maskName(i, j, fw, fh){
  let m = "";
  if (j > 0) m += "N";
  if (i < fw-1) m += "E";
  if (j < fh-1) m += "S";
  if (i > 0) m += "W";
  return m || "dot";
}
function draw(sp, scale){
  const c = document.createElement("canvas");
  c.width = sp.w*scale; c.height = sp.h*scale;
  const ctx = c.getContext("2d"); ctx.imageSmoothingEnabled = false;
  const rise = sp.rise || 0;
  if (S.lots && sp.lot){
    const fw = Math.round(sp.footprint[0]), fh = Math.round(sp.footprint[1]);
    for (let j = 0; j < fh; j++) for (let i = 0; i < fw; i++){
      const t = byId.get("lot_" + sp.lot + "_" + maskName(i,j,fw,fh));
      if (t) blitSprite(ctx, t, i*16, rise + j*16, scale);
    }
  }
  blitSprite(ctx, sp, 0, 0, scale);
  if (S.night && !NO_DARK.has(sp.category) && sp.state !== "lights"){
    ctx.globalCompositeOperation = "source-atop"; ctx.fillStyle = NIGHT; ctx.fillRect(0,0,c.width,c.height);
    ctx.globalCompositeOperation = "source-over";
    const lit = byId.get(sp.family + "_lights");
    if (lit && (sp.state === "active" || sp.state === undefined)) blitSprite(ctx, lit, 0, 0, scale);
  }
  return c;
}

const fams = new Map();
for (const s of P.sprites){
  const k = s.category + "/" + s.family;
  if (!fams.has(k)) fams.set(k, []);
  fams.get(k).push(s);
}
const pretty = s => s.replace(/_/g," ");
function variantLabel(s, fam){
  let v = s.id.startsWith(fam + "_") ? s.id.slice(fam.length+1) : (s.id === fam ? "base" : s.id);
  return pretty(v);
}

function groundTile(name){
  const g = GROUNDS.find(x => x[0]===name);
  if (!g || !g[1]) return null;
  const pal = P.palettes[g[2]][g[1]], c = document.createElement("canvas");
  c.width = c.height = 32; const ctx = c.getContext("2d");
  let seed = 7;
  const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++){
    const r = rnd(); ctx.fillStyle = pal[r < .15 ? 1 : r < .75 ? 2 : r < .93 ? 3 : r < .97 ? 0 : 4]; ctx.fillRect(x,y,1,1);
  }
  return c.toDataURL();
}
function applyGround(){
  const m = $("main");
  const veil = S.night ? "linear-gradient(" + NIGHT + "," + NIGHT + "), " : "";
  if (S.ground === "dark"){ m.style.background = veil + "#14171d"; return; }
  if (S.ground === "clear"){ m.style.background = veil + "repeating-conic-gradient(#3a4252 0 25%, #2a303c 0 50%) 0 0 / " + (8*S.zoom) + "px " + (8*S.zoom) + "px"; return; }
  m.style.background = veil + "url(" + groundTile(S.ground) + ") 0 0 / " + (32*S.zoom) + "px " + (32*S.zoom) + "px";
}

function buildControls(){
  $("sub").textContent = P.sprites.length.toLocaleString() + " sprites, 16 px per map plot. Magenta marks team colour.";
  const z = $("zoom");
  for (const n of [2,3,4,6,8]){
    const b = document.createElement("button"); b.textContent = n + "x"; b.setAttribute("aria-pressed", n===S.zoom);
    b.onclick = () => { S.zoom = n; [...z.children].forEach(x => x.setAttribute("aria-pressed", x===b)); applyGround(); render(); };
    z.appendChild(b);
  }
  const t = $("teams");
  const mk = (val, cls, title) => {
    const b = document.createElement("button"); b.className = "swatch " + (cls||""); b.title = title; b.setAttribute("aria-label", title);
    if (val !== "key") b.style.background = val;
    b.setAttribute("aria-pressed", val===S.team);
    b.onclick = () => setTeam(val);
    b.dataset.v = val; t.appendChild(b);
  };
  TEAMS.forEach((c,i) => mk(c, "", "Team colour " + (i+1)));
  mk("key", "key", "Show raw magenta key");
  const pick = document.createElement("input"); pick.type = "color"; pick.value = "#40c0b0"; pick.setAttribute("aria-label","Custom team colour");
  pick.oninput = () => setTeam(pick.value); t.appendChild(pick);
  const g = $("ground");
  for (const [n] of GROUNDS){
    const b = document.createElement("button"); b.textContent = n; b.setAttribute("aria-pressed", n===S.ground);
    b.onclick = () => { S.ground = n; [...g.children].forEach(x => x.setAttribute("aria-pressed", x===b)); applyGround(); };
    g.appendChild(b);
  }
  $("all").onchange = e => { S.all = e.target.checked; render(); };
  $("lots").onchange = e => { S.lots = e.target.checked; render(); if (S.sel) openDrawer(S.sel, S.variant); };
  $("night").onchange = e => { S.night = e.target.checked; applyGround(); render(); if (S.sel) openDrawer(S.sel, S.variant); };
  $("q").oninput = e => { S.q = e.target.value.trim().toLowerCase(); buildNav(); render(); };
  $("close").onclick = closeDrawer;
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
}
function setTeam(v){
  S.team = v;
  [...$("teams").querySelectorAll(".swatch")].forEach(b => b.setAttribute("aria-pressed", b.dataset.v===v));
  render(); if (S.sel) openDrawer(S.sel, S.variant);
}

function buildNav(){
  const nav = $("nav"); nav.innerHTML = "";
  const counts = {};
  for (const s of P.sprites) counts[s.category] = (counts[s.category]||0) + 1;
  const add = (key, label, n) => {
    const b = document.createElement("button");
    b.innerHTML = "<span>" + label + "</span><span>" + (n ?? "") + "</span>";
    b.setAttribute("aria-current", key===S.cat && !S.q);
    b.onclick = () => { S.cat = key; S.q = ""; $("q").value = ""; closeDrawer(); buildNav(); render(); $("main").scrollTop = 0; };
    nav.appendChild(b);
  };
  for (const c of CAT_ORDER) if (counts[c]) add(c, LABEL[c] || c[0].toUpperCase() + c.slice(1), counts[c]);
  nav.appendChild(document.createElement("hr"));
  add("palettes", "Terrain palettes", Object.keys(P.palettes.summer).length);
}

function matches(s){
  if (!S.q) return s.category === S.cat;
  return S.q.split(/\s+/).every(w => s.id.includes(w) || s.category.includes(w) || s.group.includes(w) || (s.era||"").toLowerCase().includes(w));
}
function render(){
  const st = $("stage"); st.innerHTML = "";
  if (!S.q && S.cat === "palettes") return renderPalettes(st);
  let list = P.sprites.filter(matches);
  if (!S.all){
    const seen = new Set();
    list = list.filter(s => { const k = s.category+"/"+s.family; if (seen.has(k)) return false; seen.add(k); return true; });
  }
  if (!list.length){
    st.innerHTML = '<div class="empty">No sprites match "' + S.q.replace(/[<&"]/g,"") + '". Try a shorter word, like tank, road or hut.</div>';
    return;
  }
  const sections = new Map();
  for (const s of list){
    let key;
    if (S.q) key = LABEL[s.category] || s.category;
    else if (s.group === s.category) key = s.era || "Any era";
    else key = pretty(s.group);
    if (!sections.has(key)) sections.set(key, []);
    sections.get(key).push(s);
  }
  let keys = [...sections.keys()];
  if (!S.q && list.every(s => s.group === s.category)) keys.sort((a,b) => ERA_ORDER.indexOf(a) - ERA_ORDER.indexOf(b));
  for (const k of keys){
    const items = sections.get(k);
    const sec = document.createElement("section"); sec.className = "grp";
    sec.innerHTML = "<h2>" + (k[0].toUpperCase() + k.slice(1)) + "<span>" + items.length + "</span></h2>";
    const wrap = document.createElement("div"); wrap.className = "tiles";
    for (const s of items){
      const fam = fams.get(s.category+"/"+s.family);
      const b = document.createElement("button"); b.className = "tile";
      b.setAttribute("aria-label", pretty(s.id));
      b.setAttribute("aria-pressed", !!(S.sel && S.sel[0] === fam[0]));
      b.appendChild(draw(s, S.zoom));
      const nm = document.createElement("span"); nm.className = "nm";
      nm.textContent = pretty(S.all ? s.id : s.family);
      if (!S.all && fam.length > 1){ const em = document.createElement("em"); em.textContent = fam.length; nm.appendChild(em); }
      b.appendChild(nm);
      b.onclick = () => openDrawer(fam, S.all ? fam.indexOf(s) : 0);
      wrap.appendChild(b);
    }
    sec.appendChild(wrap); st.appendChild(sec);
  }
}

function stopPlay(){ if (S.timer){ clearInterval(S.timer); S.timer = null; $("dPlay").textContent = "Play frames"; } }
function openDrawer(fam, idx){
  stopPlay();
  S.sel = fam; S.variant = idx;
  const s = fam[idx], fk = s.family;
  $("dTitle").textContent = pretty(s.id);
  const scale = Math.max(2, Math.min(10, Math.floor(256 / Math.max(s.w, s.h))));
  const big = $("dBig"); big.innerHTML = ""; big.appendChild(draw(s, scale));
  big.style.background = getComputedStyle($("main")).background;
  const v = $("dVar"); v.innerHTML = "";
  if (fam.length > 1) fam.forEach((f,i) => {
    const b = document.createElement("button"); b.title = variantLabel(f, fk); b.setAttribute("aria-label", variantLabel(f, fk));
    b.setAttribute("aria-pressed", i===idx);
    b.appendChild(draw(f, Math.max(1, Math.min(3, Math.floor(40 / Math.max(f.w, f.h))))));
    b.onclick = () => openDrawer(fam, i); v.appendChild(b);
  });
  const framed = fam.filter(f => f.frame !== undefined && f.frame !== null && f.frame !== "dead" && (f.state === s.state || !s.state || f.state === "active"));
  $("dPlay").hidden = framed.length < 2;
  $("dPlay").onclick = () => {
    if (S.timer) return stopPlay();
    let i = Math.max(0, framed.indexOf(s));
    $("dPlay").textContent = "Stop";
    S.timer = setInterval(() => {
      i = (i + 1) % framed.length;
      const f = framed[i]; big.innerHTML = ""; big.appendChild(draw(f, scale));
    }, 220);
  };
  $("dFile").href = s.file;
  const fp = s.footprint.map(n => +n).join(" x ");
  const rows = [
    ["Size", s.w + " x " + s.h + " px"], ["Footprint", fp + " plots"], ["Era", s.era], ["Category", pretty(s.category) + (s.group !== s.category ? ", " + pretty(s.group) : "")],
    ["Facing", {e:"east (flip for west)", s:"south", n:"north"}[s.state]], ["State", "esn".includes(s.state) && s.state.length === 1 ? null : s.state], ["Frame", s.frame], ["Rise", s.rise ? s.rise + " px above footprint" : null], ["Lot", s.lot ? s.lot + " (lot_" + s.lot + "_*)" : null], ["Variant", fam.length > 1 ? (idx+1) + " of " + fam.length : null],
    ["Tags", s.tags && s.tags.join(", ")], ["Note", s.note], ["File", s.file], ["Sheet", "sheets/" + s.category + ".png at " + s.x + ", " + s.y]
  ];
  $("dMeta").innerHTML = rows.filter(r => r[1] !== undefined && r[1] !== null && r[1] !== "").map(r => "<dt>" + r[0] + "</dt><dd>" + String(r[1]).replace(/[<&]/g,"") + "</dd>").join("");
  $("drawer").classList.add("open"); document.body.classList.add("drawer");
  document.querySelectorAll(".tile").forEach(t => t.setAttribute("aria-pressed", false));
}
function closeDrawer(){ stopPlay(); S.sel = null; $("drawer").classList.remove("open"); document.body.classList.remove("drawer"); document.querySelectorAll(".tile").forEach(t => t.setAttribute("aria-pressed", false)); }

let season = "summer";
function renderPalettes(st){
  const box = document.createElement("div"); box.className = "terrain";
  box.innerHTML = '<p class="lede">Terrain is drawn pixel by pixel from these colours. Each type has five shades, darkest first. Pick a shade per map pixel from noise so large areas never look flat. Select a swatch to copy its hex.</p>';
  const seg = document.createElement("div"); seg.className = "seg"; seg.style.display = "inline-flex";
  for (const s of Object.keys(P.palettes)){
    const b = document.createElement("button"); b.textContent = s; b.setAttribute("aria-pressed", s===season);
    b.onclick = () => { season = s; render(); }; seg.appendChild(b);
  }
  box.appendChild(seg);
  const mw = document.createElement("div"); mw.className = "mapwrap";
  const im = new Image(); im.onload = () => {
    const c = document.createElement("canvas"), k = 4; c.width = im.width*k; c.height = im.height*k;
    const ctx = c.getContext("2d"); ctx.imageSmoothingEnabled = false; ctx.drawImage(im,0,0,c.width,c.height); mw.appendChild(c);
  };
  im.src = P.maps[season]; box.appendChild(mw);
  const pal = document.createElement("div"); pal.className = "pal";
  for (const [t, shades] of Object.entries(P.palettes[season])){
    const row = document.createElement("div");
    row.innerHTML = '<span class="n">' + pretty(t) + "</span>";
    for (const h of shades){
      const b = document.createElement("button"); b.style.background = h; b.title = h; b.setAttribute("aria-label", pretty(t) + " " + h);
      b.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(h); flash("Copied " + h); };
      row.appendChild(b);
    }
    pal.appendChild(row);
  }
  box.appendChild(pal); st.appendChild(box);
}
let ft;
function flash(msg){ const s = $("status"); s.textContent = msg; s.classList.add("on"); clearTimeout(ft); ft = setTimeout(() => s.classList.remove("on"), 1400); }

const hdr = document.querySelector("header");
new ResizeObserver(() => document.documentElement.style.setProperty("--hh", (hdr.getBoundingClientRect().bottom) + "px")).observe(hdr);
loadSheets().then(() => { buildControls(); buildNav(); applyGround(); render(); });
</script>
