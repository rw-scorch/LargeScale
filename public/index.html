<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f2233">
<title>Large Scale</title>
<style>
:root{--ink:#0f2233;--deep:#10233a;--line:#24506f;--parch:#e9dcb8;--mute:#9fb3c2;--signal:#e8c84a;--bad:#e06a5a;--good:#6fcf7a;--panel:rgba(13,29,44,.84);--edge:rgba(70,125,165,.5);--left-w:min(290px,32vw);--side-w:min(340px,36vw)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep);color:var(--parch);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit;background:#16324a;border:2px solid var(--line);border-radius:3px;padding:6px 10px;min-height:36px}
button{cursor:pointer;background:#183a54}
button:hover:not(:disabled){border-color:var(--mute)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:#2a5a36;border-color:#3f7f4c}
button.ghost{background:transparent;border-color:transparent}
button.danger{background:#5a2420;border-color:var(--bad)}
input[type=range]{padding:0;min-height:0;accent-color:var(--signal)}
input[type=checkbox]{min-height:0;width:18px;height:18px;vertical-align:middle}
h1{font-size:22px;margin:0 0 12px}
h2{font-size:16px;margin:18px 0 8px}
.muted{color:var(--mute)}
.msg{color:var(--signal);min-height:1.4em;margin:8px 0 0}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.row.spread{justify-content:space-between}
#screen{height:100%;overflow:auto;display:flex;flex-direction:column;padding:16px}
#screen>*{margin:auto;flex-shrink:0}
.card{background:var(--ink);border:2px solid var(--line);border-radius:4px;padding:20px;width:min(360px,100%)}
.card.wide{width:min(560px,100%)}
.card form,.form{display:flex;flex-direction:column;gap:10px}
.worlds{display:flex;flex-direction:column;gap:6px}
.world{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px solid var(--line);border-radius:3px;padding:6px 8px}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#game input,#game .lines{user-select:text;-webkit-user-select:text}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
#overlay{position:absolute;inset:0;pointer-events:none}
#overlay>*{pointer-events:auto;touch-action:pan-x pan-y}
#game{--hud:52px}
#overlay>.col{position:absolute;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.col>*{pointer-events:auto;touch-action:pan-x pan-y}
.col>.panel{position:relative}
#left-col{left:8px;top:max(8px,env(safe-area-inset-top));bottom:8px;width:var(--left-w)}
#side{right:8px;top:var(--hud);bottom:8px;width:var(--side-w)}
#top-mid{left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);align-items:center;width:max-content;max-width:calc(100% - 2 * var(--left-w) - 48px)}
#top-mid>.banner{position:static;transform:none;max-width:100%}
#top-mid>#toasts{pointer-events:none}
.pill{display:flex;gap:10px;align-items:center;padding:5px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--edge);white-space:nowrap;box-shadow:0 4px 18px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pill .badge{margin:0}
#world-clock,#world-season{color:var(--mute);font-size:13px}
.guide{display:flex;flex-direction:column;gap:3px;width:min(460px,100%);padding:6px 12px 8px;background:var(--panel);border:1px solid var(--signal);border-radius:10px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.guide .grow{flex:1}
#guide-text{font-size:13px}
.guide .meter{display:block;flex:none}
.guide .meter .fill{background:var(--signal)}
button.act.pulse{animation:beckon 1.4s ease-in-out infinite}
@keyframes beckon{50%{box-shadow:0 0 0 3px rgba(232,200,74,.85),0 0 16px rgba(232,200,74,.6);background:rgba(232,200,74,.15)}}
#corner{position:absolute;top:max(8px,env(safe-area-inset-top));right:8px;display:flex;gap:4px}
.icon-btn{min-width:38px;min-height:38px;padding:4px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--edge);border-radius:8px}
.fs-mark{display:block;width:14px;height:14px;border:2px dashed var(--parch);border-radius:2px}
#control{order:9;flex:none;margin-top:auto;display:flex;flex-direction:column;gap:6px}
#my-nation{font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.troops{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.troops b{font-size:16px}
.meter{flex-basis:100%;height:4px;background:#16324a;border-radius:2px;overflow:hidden}
.meter .fill{display:block;height:100%;background:var(--good)}
.res-list{display:flex;flex-wrap:wrap;gap:3px 12px}
.res{display:inline-flex;align-items:center;gap:4px;font-size:13px}
.res small{font-size:11px}
.up{color:var(--good)}
.down{color:var(--bad)}
.stackform{display:flex;gap:6px;align-items:center}
.stackform input{flex:1;min-width:50px}
#action-bar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:2px;padding:4px}
button.act{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:66px;padding:4px 6px 6px;background:transparent;border:1px solid transparent;border-radius:6px;font-size:12px}
button.act:hover:not(:disabled){background:rgba(255,255,255,.06);border-color:var(--edge)}
button.act.on{background:rgba(232,200,74,.12);border-color:var(--signal)}
button.act kbd.key{position:absolute;top:2px;right:2px;margin:0;padding:0 3px;font-size:10px}
button.act .prog{position:absolute;left:6px;bottom:2px;height:3px;border-radius:2px;background:var(--signal);max-width:calc(100% - 12px)}
button.act .alert{position:absolute;top:4px;left:6px;width:8px;height:8px;border-radius:50%;background:var(--signal);box-shadow:0 0 6px var(--signal)}
.status{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}
.dot.online{background:var(--good)}
.dot.waiting,.dot.replaced,.dot.outdated,.dot.closed,.dot.removed,.dot.deleted{background:var(--bad)}
.dot.connecting,.dot.reconnecting{background:var(--signal)}
.panel{position:absolute;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:6px 10px 10px;box-shadow:0 4px 18px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.panel .title{padding:4px 0;font-weight:600;min-height:0}
.panel.shut>*:not(.title):not(.title-row){display:none!important}
#nation-card .facts{display:flex;flex-direction:column;gap:2px;font-size:13px}
#nation-card .facts span{display:flex;align-items:center;gap:4px}
.panel.card{display:flex;flex-direction:column;gap:6px;flex:0 1 auto;min-height:0;overflow:auto}
#nations{flex:0 1 auto;min-height:0;overflow:auto;padding-top:2px}
#nations.shut{align-self:flex-start}
.title-row .title{flex:1;text-align:left;padding-left:0}
#nations .name{display:inline-block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
#nations tbody tr{cursor:pointer}
#nations tbody tr:hover td{background:rgba(255,255,255,.05)}
#nations .rank{color:var(--mute)}
#nations .who .swatch{margin-right:5px}
#nations td:nth-child(3){text-align:center}
#attacks{order:8;margin-top:auto;flex:none;display:flex;flex-direction:column;gap:4px;border-color:rgba(224,106,90,.6)}
#side:has(#attacks:not([hidden])) #feed{margin-top:0}
.attack-list{display:flex;flex-direction:column;gap:3px;max-height:160px;overflow:auto}
.attack{display:flex;align-items:center;gap:6px;font-size:13px}
.attack .what{flex:1;min-width:0}
.attack.in .what{color:#f3a79b}
.attack.out .what{cursor:pointer}
#overlay>#alert-frame{position:absolute;inset:0;pointer-events:none;z-index:1;box-shadow:inset 0 0 0 3px rgba(224,70,60,.9),inset 0 0 70px rgba(224,70,60,.45);animation:alarm 1.2s ease-in-out infinite}
@keyframes alarm{50%{box-shadow:inset 0 0 0 3px rgba(224,70,60,.5),inset 0 0 30px rgba(224,70,60,.2)}}
#feed{order:9;margin-top:auto;flex:0 4 auto;min-height:92px;display:flex;flex-direction:column;gap:6px}
#feed.folded{align-self:flex-end}
#feed .tabs{gap:4px}
#feed .grow{flex:1}
#feed .tab{display:inline-flex;align-items:center;gap:4px}
#feed .tab.on{border-color:var(--signal)}
#feed .lines{flex:1 1 auto;height:180px;min-height:36px;overflow:auto;font-size:13px}
#chat{flex:1 1 auto;min-height:0}
#feed .item{display:flex;gap:6px;align-items:flex-start;margin:0;padding:3px 4px;border-radius:4px}
#feed .item .icon{margin-top:1px}
#feed .item.go{cursor:pointer}
#feed .item.go:hover{background:rgba(255,255,255,.06)}
#feed .item time{margin-left:auto;padding-left:6px;color:var(--mute);font-size:11px;flex:none}
#feed .item .count{color:var(--mute);font-size:11px;flex:none}
#feed .item.danger .text{color:#f3a79b}
#feed .peek{margin:0;display:flex;gap:6px;align-items:flex-start;font-size:13px;cursor:pointer;max-width:var(--side-w)}
.tabs button{min-height:30px;padding:2px 8px}
.build-list{display:flex;flex-direction:column;gap:4px}
.build-item{display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:2px}
.build-item .why{color:var(--bad);font-size:12px}
.desc{font-size:12px;line-height:1.35}
.upgrade-name .desc{display:block;color:var(--mute)}
#purse{color:var(--signal)}
.town-lines{display:flex;flex-direction:column;gap:2px}
.next-step{margin:0;padding:6px 8px;border-left:3px solid var(--signal);background:rgba(232,200,74,.08)}
.why{color:var(--bad);font-size:12px;margin:4px 0}
.demand{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;font-size:13px}
.demand .bar{position:relative;height:10px;background:#16324a;border:1px solid var(--line);border-radius:2px}
.demand .bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--mute)}
.demand .fill{position:absolute;top:0;bottom:0}
.demand .fill.up{background:var(--good)}
.demand .fill.down{background:var(--bad)}
.panel.center{left:50%;transform:translateX(-50%);top:calc(var(--hud,48px) + 16px);width:min(980px,calc(100% - 16px));max-height:calc(100% - var(--hud,48px) - 32px);overflow:auto;display:flex;flex-direction:column;gap:8px;z-index:2}
.army-list{display:flex;flex-direction:column;gap:6px}
#away-panel{width:min(560px,calc(100% - 16px));z-index:6;background:var(--ink)}
.away-list{display:flex;flex-direction:column;gap:4px}
.away-line{display:flex;align-items:center;gap:8px;margin:0;font-size:14px}
.away-line.good span{color:var(--good)}
.away-line.bad span{color:var(--bad)}
.army-row{display:flex;flex-direction:column;gap:3px;border:2px solid var(--line);border-radius:3px;padding:6px 8px}
.army-row.locked{opacity:.65}
.upgrade-list{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - var(--hud,48px) - 260px);overflow:auto}
.upgrade-row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;border:1px solid var(--edge);border-radius:6px;padding:4px 8px;user-select:none}
.upgrade-head{margin:6px 0 0;font-weight:600;font-size:13px}
.stepper{display:flex;gap:4px;align-items:center}
.stepper input.count{width:64px;min-height:30px;padding:2px 6px;text-align:center}
.upgrade-locked{display:flex;flex-direction:column;gap:4px;margin-top:4px}
#upgrade-locked summary{cursor:pointer;color:var(--mute);padding:4px 0}
.upgrade-foot .grow{flex:1}
#upgrade-total{margin:0}
.upgrade-row.on{border-color:var(--signal);background:#3a3a1c}
.upgrade-row.locked{opacity:.6;grid-template-columns:34px 1fr}
.upgrade-row .tick{touch-action:none;width:24px;height:24px;border:2px solid var(--mute);border-radius:3px;display:grid;place-items:center;cursor:ns-resize}
.upgrade-row.on .tick::after{content:"";width:12px;height:12px;background:var(--signal)}
.upgrade-row .thumb{width:32px;height:32px;image-rendering:pixelated}
#upgrade-summary{margin:0;color:var(--signal)}
.settings-toggles{display:flex;flex-direction:column;gap:6px}
.settings-toggles label{gap:8px;cursor:pointer}
.key-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:4px 16px}
.key-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;border-bottom:1px solid rgba(70,125,165,.25);padding:2px 0}
.key-row button{min-width:64px;font-family:ui-monospace,monospace}
#settings-note{margin:0;min-height:1.4em;color:var(--signal)}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.admin-grid section{display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--line);padding-top:6px}
.admin-list{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.admin-log{font-size:12px;max-height:200px;overflow:auto}
.admin-log p{margin:1px 0}
.admin-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
input.small{width:110px}
.tech-era{display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--line);padding-top:6px}
.tech-grid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:6px}
.tech-col{display:flex;flex-direction:column;gap:4px}
button.tech{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;font-size:13px;padding:4px 8px}
button.tech span{font-size:12px;color:var(--mute)}
button.tech.known{background:#24452c;border-color:#3f7f4c}
button.tech.current{border-color:var(--signal);background:#3a3a1c}
button.tech.queued{border-color:#8fa8c0;border-style:dashed}
button.tech.ready{border-color:var(--good)}
button.tech.locked{opacity:.6}
button.tech.picked{outline:2px solid var(--parch)}
button.tech.era{align-items:center;text-align:center}
.tech-detail{border-top:2px solid var(--line);padding:6px 0 2px;position:sticky;bottom:-8px;background:#0f2233}
.tech-detail p{margin:2px 0}
button.chip{min-height:28px;padding:2px 8px;font-size:12px}
#chat{display:flex;flex-direction:column;gap:6px}
#chat .lines p{margin:2px 0}
#chat form{display:flex;gap:6px}
#chat input{flex:1;min-width:0}
.badge{background:var(--signal);color:var(--ink);border-radius:8px;padding:0 6px;font-size:12px;margin-left:4px}
table{border-collapse:collapse;font-size:13px}
td,th{padding:2px 6px;text-align:left}
td:nth-child(n+3),th:nth-child(n+3){text-align:right}
tr.me td{color:var(--signal)}
tr.dead td{opacity:.45;text-decoration:line-through}
.swatch{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:middle}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.on{background:#4cd964;box-shadow:0 0 6px rgba(76,217,100,.8)}
.dot.off{background:#56616d}
.banner{position:absolute;top:calc(var(--hud,48px) + 16px);left:50%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--signal);border-radius:4px;padding:8px 14px;max-width:calc(100% - 16px);text-align:center}
.banner.big{top:40%;font-size:17px;display:flex;flex-direction:column;gap:10px;align-items:center}
#toasts{display:flex;flex-direction:column;align-items:center;gap:4px}
#ring-back{position:absolute;inset:0;z-index:4;background:transparent}
#overlay>#ring-dot{position:absolute;z-index:5;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 3px rgba(0,0,0,.4);pointer-events:none}
#ring{position:absolute;z-index:5;width:0;height:0}
#ring::before{content:"";position:absolute;left:-84px;top:-84px;width:168px;height:168px;border-radius:50%;border:2px solid rgba(232,200,74,.3);background:radial-gradient(circle,rgba(13,29,44,.55),rgba(13,29,44,.15) 70%);pointer-events:none}
.ring-item{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:68px;max-width:120px;min-height:0;padding:5px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--edge);font-size:12px;line-height:1.2;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.ring-item .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:104px}
.ring-item .note{color:var(--mute);font-size:11px}
.ring-item kbd.key{position:absolute;top:-6px;right:-4px;background:var(--ink)}
.ring-item.centre{background:#23492f;border-color:var(--signal);font-weight:600;padding:8px 10px}
.ring-item:hover:not(:disabled){border-color:var(--signal)}
#overlay>.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:2px 8px;font-size:13px;white-space:nowrap;z-index:3;display:flex;gap:6px;align-items:center}
.toast{margin:0;background:var(--panel);border:1px solid var(--edge);border-left:4px solid var(--signal);padding:6px 12px;border-radius:6px;max-width:420px;box-shadow:0 4px 18px rgba(0,0,0,.35)}
kbd.key{font:11px/1 ui-monospace,monospace;border:1px solid var(--mute);border-radius:3px;padding:1px 4px;margin-left:2px;color:var(--mute);vertical-align:middle}
button.on{border-color:var(--signal)}
@media (pointer:fine){.coarse-only{display:none!important}}
#overlay>#crosshair{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;pointer-events:none;z-index:1}
#crosshair::before,#crosshair::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(10,22,34,.85)}
#crosshair::before{left:19px;top:0;width:2px;height:40px}
#crosshair::after{top:19px;left:0;width:40px;height:2px}
#aim-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:88px;display:flex;gap:8px;touch-action:none}
#aim-bar button{min-height:48px;min-width:96px;border-radius:10px;touch-action:none}
#aim-bar button.on{border-color:var(--signal);background:#3a3a1c}
.place-confirm{position:absolute;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:6px;background:var(--panel);border:1px solid var(--signal);border-radius:8px;z-index:3;box-shadow:0 4px 18px rgba(0,0,0,.45);white-space:nowrap}
.place-confirm .why{margin:0}
#build-hint{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
@media (pointer:coarse){kbd.key,.fine-only{display:none!important}.panel,.pill{-webkit-backdrop-filter:none;backdrop-filter:none;--panel:rgba(13,29,44,.93)}}
[hidden]{display:none!important}
#rotate{display:none}
@media (max-height:500px){
  body{font-size:13px}
  button,input,select{padding:4px 8px;min-height:32px}
  #game{--hud:46px;--left-w:30vw;--side-w:30vw}
  .pill{gap:6px;padding:3px 10px}
  .world-name,#world-clock{display:none}
  .icon-btn{min-width:34px;min-height:34px;padding:2px}
  #feed .lines{height:96px}
  button.act{min-width:36px;padding:4px}
  button.act .label{display:none}
  #aim-bar{bottom:64px}
  .guide{padding:4px 10px 6px;width:min(360px,100%)}
  #guide-text{font-size:12px;line-height:1.3}
  #aim-bar button{min-height:42px;min-width:84px}
  .panel{padding:4px 8px 6px}
  .res{font-size:12px}
  .troops b{font-size:14px}
}
@media (orientation:portrait) and (max-width:900px){
  #game:not([hidden]) ~ #rotate{display:grid;position:fixed;inset:0;place-items:center;background:var(--ink);font-size:18px;padding:24px;text-align:center;z-index:10}
}
</style>
</head>
<body>
<main id="screen"></main>
<div id="game" hidden><canvas id="map"></canvas><div id="overlay"></div></div>
<div id="rotate">Turn your phone sideways to play.</div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
